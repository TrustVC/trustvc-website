sonar.projectKey=TrustVC_trustvc-website
sonar.organization=trustvc

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/__tests__/**,src/setupTests.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/e2e/**,**/trustvc-cms/**,**/coverage/**,public/**,src/**/*.test.ts,src/**/*.test.tsx,src/__tests__/**,src/setupTests.ts

sonar.coverage.exclusions=**/*.config.*,src/main.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Test files and the Vite config are not in the lcov report. Leave them out of
# the coverage gate so new tests are not counted as uncovered production code.
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,vite.config.js
