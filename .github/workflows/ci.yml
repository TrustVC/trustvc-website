name: CI - Lint and Test

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          VITE_RPC_URL_1: ${{ secrets.VITE_RPC_URL_1 }}
          VITE_RPC_URL_101010: ${{ secrets.VITE_RPC_URL_101010 }}
          # Analytics disabled in CI — matches local .env.example defaults
          VITE_GTM_CONTAINER_ID: ''
          VITE_GA4_TAG_ID: ''
          VITE_PLATFORM: local

      - name: Upload coverage for Sonar
        if: ${{ !cancelled() && matrix.node-version == '22.x' }} # one leg is enough
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: warn

  sonar:
    name: SonarCloud Scan
    needs: lint-and-test
    if: ${{ !cancelled() }} # still report to Sonar when a test fails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed for Sonar's new-code analysis

      - name: Download coverage
        uses: actions/download-artifact@v4
        continue-on-error: true # scan without coverage rather than not at all
        with:
          name: coverage
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
