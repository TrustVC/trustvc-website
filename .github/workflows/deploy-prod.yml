name: Deploy TrustVC Website (Production)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy to CloudFront (Production)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AWS_REGION: ap-southeast-1
      S3_BUCKET: ${{ secrets.S3_BUCKET_PROD }}
      CF_DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }}
      ENV_FILE: ${{ secrets.TRUSTVC_WEB_ENV_PRODUCTION }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: production
      VITE_SENTRY_RELEASE: ${{ github.sha }}
      VITE_GTM_CONTAINER_ID: ${{ secrets.VITE_GTM_CONTAINER_ID_PRODUCTION }}
      VITE_GA4_TAG_ID: ${{ secrets.VITE_GA4_TAG_ID_PRODUCTION }}
      VITE_PLATFORM: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Create .env for build
        run: |
          printf '%s\n' "$ENV_FILE" \
            | grep -v '^VITE_SENTRY_DSN=' \
            | grep -v '^VITE_SENTRY_ENVIRONMENT=' \
            | grep -v '^VITE_SENTRY_RELEASE=' \
            | grep -v '^VITE_GTM_CONTAINER_ID=' \
            | grep -v '^VITE_GA4_TAG_ID=' \
            | grep -v '^VITE_PLATFORM=' > .env
          echo "VITE_GTM_CONTAINER_ID=${VITE_GTM_CONTAINER_ID}" >> .env
          echo "VITE_GA4_TAG_ID=${VITE_GA4_TAG_ID}" >> .env
          echo "VITE_PLATFORM=${VITE_PLATFORM}" >> .env
          echo "VITE_SENTRY_DSN=${VITE_SENTRY_DSN}" >> .env
          echo "VITE_SENTRY_ENVIRONMENT=${VITE_SENTRY_ENVIRONMENT}" >> .env
          echo "VITE_SENTRY_RELEASE=${VITE_SENTRY_RELEASE}" >> .env

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync assets to S3
        run: |
          aws s3 sync ./dist "s3://${S3_BUCKET}" --delete --exclude "*.html" --cache-control "public, max-age=31536000"
          aws s3 sync ./dist "s3://${S3_BUCKET}" --cache-control "public, max-age=0, must-revalidate" --exclude "*" --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION}" \
            --paths "/*"
