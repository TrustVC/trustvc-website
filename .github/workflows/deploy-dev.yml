name: Deploy TrustVC Website (Development)

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: "dist"
  AWS_REGION: ap-southeast-1

permissions:
  contents: read

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.ref }}
          check-name: 'Lint & Test (22.x)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  build-dev:
    name: Build (Dev)
    runs-on: ubuntu-latest
    needs: wait-for-ci
    permissions:
      contents: read

    env:
      AWS_REGION: ap-southeast-1
      S3_BUCKET: ${{ secrets.S3_BUCKET_DEV }}
      ENV_FILE: ${{ secrets.TRUSTVC_WEB_ENV_DEVELOPMENT }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: dev
      VITE_SENTRY_RELEASE: trustvc-web-dev-${{ github.run_number }}.${{ github.run_attempt }}
      VITE_GTM_CONTAINER_ID: ${{ secrets.VITE_GTM_CONTAINER_ID_DEVELOPMENT }}
      VITE_GA4_TAG_ID: ${{ secrets.VITE_GA4_TAG_ID_DEVELOPMENT }}
      VITE_PLATFORM: dev
      VITE_PIMLICO_API_KEY: ${{ secrets.VITE_PIMLICO_API_KEY }}
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Create .env for build
        run: |
          # Drop the keys set explicitly below. sed, not grep -v: grep exits 1
          # when no lines are left, which would fail this step.
          printf '%s\n' "$ENV_FILE" \
            | grep -v '^VITE_SENTRY_DSN=' \
            | grep -v '^VITE_SENTRY_ENVIRONMENT=' \
            | grep -v '^VITE_SENTRY_RELEASE=' \
            | grep -v '^VITE_GTM_CONTAINER_ID=' \
            | grep -v '^VITE_GA4_TAG_ID=' \
            | grep -v '^VITE_PLATFORM=' \
            | grep -v '^VITE_PIMLICO_API_KEY=' \
            | grep -v '^ALCHEMY_API_KEY=' \
            | grep -v '^VITE_RPC_URL_1=' \
            | grep -v '^VITE_RPC_URL_137=' \
            | grep -v '^VITE_RPC_URL_11155111=' \
            | grep -v '^VITE_RPC_URL_80002=' > .env
          echo "VITE_GTM_CONTAINER_ID=${VITE_GTM_CONTAINER_ID}" >> .env
          echo "VITE_GA4_TAG_ID=${VITE_GA4_TAG_ID}" >> .env
          echo "VITE_PLATFORM=${VITE_PLATFORM}" >> .env
          echo "VITE_SENTRY_DSN=${VITE_SENTRY_DSN}" >> .env
          echo "VITE_SENTRY_ENVIRONMENT=${VITE_SENTRY_ENVIRONMENT}" >> .env
          echo "VITE_SENTRY_RELEASE=${VITE_SENTRY_RELEASE}" >> .env
          echo "VITE_PIMLICO_API_KEY=${VITE_PIMLICO_API_KEY}" >> .env
          echo "ALCHEMY_API_KEY=${ALCHEMY_API_KEY}" >> .env

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Upload build artifact (Dev)
        uses: actions/upload-artifact@v7
        with:
          name: site-dev
          path: ${{ env.BUILD_DIR }}

  deploy-dev:
    name: Deploy to S3 (Dev) 
    needs: build-dev
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: site-dev
          path: ${{ env.BUILD_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      # Secrets reach run blocks only through env, never ${{ secrets.* }}
      # inside the script, so they never appear in the command text.
      - name: Sync static assets with long cache
        env:
          S3_BUCKET_DEV: ${{ secrets.S3_BUCKET_DEV }}
        run: |
          aws s3 sync "$BUILD_DIR" "s3://${S3_BUCKET_DEV}" \
            --delete \
            --exclude "*" \
            --include "assets/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML and other assets with no-cache
        env:
          S3_BUCKET_DEV: ${{ secrets.S3_BUCKET_DEV }}
        run: |
          aws s3 sync "$BUILD_DIR" "s3://${S3_BUCKET_DEV}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID_DEV: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_DEV }}
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID_DEV != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID_DEV}" \
            --paths "/*"
