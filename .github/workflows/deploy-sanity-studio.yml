name: Deploy Sanity Studio

on:
  push:
    branches:
      - main
    paths:
      - 'trustvc-cms/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Sanity hosted studio
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trustvc-cms

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: trustvc-cms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Sanity Studio
        run: npm run deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ secrets.SANITY_STUDIO_DATASET }}
          SANITY_STUDIO_APP_ID: ${{ secrets.SANITY_STUDIO_APP_ID }}
